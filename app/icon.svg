<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d14"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="trailGlow" x="-80%" y="-40%" width="260%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="trailGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="roundRect">
      <rect width="256" height="256" rx="52" ry="52"/>
    </clipPath>
  </defs>
  <rect width="256" height="256" rx="52" ry="52" fill="url(#bgGrad)"/>
  <g clip-path="url(#roundRect)">
    <ellipse cx="128" cy="148" rx="90" ry="80" fill="url(#ambientGlow)"/>
    <path d="M 60 200 Q 110 130 170 72" fill="none" stroke="url(#arcGrad)" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.5" filter="url(#trailGlow)"/>
    <g filter="url(#trailGlow)" opacity="0.9">
      <polygon points="128,178 122,210 128,204 134,210" fill="url(#trailGrad)"/>
      <line x1="122" y1="186" x2="108" y2="218" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
      <line x1="134" y1="186" x2="148" y2="218" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    </g>
    <g filter="url(#glow)">
      <path d="M128 58 C128 58, 108 80, 108 130 L128 142 L148 130 C148 80, 128 58, 128 58 Z" fill="url(#rocketGrad)"/>
      <path d="M128 58 C128 58, 120 76, 120 100 L128 108 C128 108, 125 82, 128 58 Z" fill="#a5b4fc" opacity="0.35"/>
      <path d="M108 130 L94 158 L108 148 Z" fill="#4f46e5"/>
      <path d="M148 130 L162 158 L148 148 Z" fill="#4f46e5"/>
      <circle cx="128" cy="114" r="10" fill="#0a0a0f" opacity="0.7"/>
      <circle cx="128" cy="114" r="7" fill="#818cf8" opacity="0.25"/>
      <circle cx="125" cy="111" r="2.5" fill="#c7d2fe" opacity="0.6"/>
    </g>
  </g>
</svg>
